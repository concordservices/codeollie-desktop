<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOllie Desktop 🤖</title>
    <style>
        body {
            background-color: #2E2E2E;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 📁 Left Sidebar (Project Explorer) */
        .sidebar {
            width: 250px;
            background-color: #1F1F1F;
            border-right: 2px solid #444;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            font-size: 1.2em;
            margin-top: 0;
            color: #5A9EAA;
        }
        .folder-btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .folder-btn:hover {
            background-color: #5A5A5A;
        }

        /* 💬 Right Panel (Interactive AI Chat Hub) */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #2E2E2E;
        }
        .chat-header {
            background-color: #252525;
            padding: 15px 20px;
            border-bottom: 2px solid #444;
        }
        .chat-header h1 {
            margin: 0;
            font-size: 1.5em;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
        }
        .bot {
            background-color: #444;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .user {
            background-color: #5A9EAA;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* ⌨️ Lower Chat Input Bar */
        .chat-input-area {
            padding: 20px;
            background-color: #252525;
            display: flex;
            gap: 10px;
            border-top: 2px solid #444;
        }
        .chat-input {
            flex: 1;
            background-color: #444;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 12px;
            color: white;
            font-size: 1em;
            outline: none;
        }
        .send-btn {
            background-color: #5A9EAA;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .send-btn:hover {
            background-color: #72B2BE;
        }
    </style>
</head>
<body>

    <!-- 📁 Sidebar panel -->
    <div class="sidebar">
        <h2>Workspace</h2>
        <button class="folder-btn">📂 Open Project Folder</button>
        <p style="color: #888; font-size: 0.9em; margin-top: 20px;">No folder loaded</p>
    </div>

    <!-- 💬 Chat layout area -->
    <div class="chat-container">
        <div class="chat-header">
            <h1>CodeOllie Desktop v1.0.0</h1>
        </div>
        
        <div class="chat-messages">
            <div class="message bot">
                🤖 Hello! Welcome to the new CodeOllie GUI. Load up a folder project on the sidebar and let's start coding together!
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" placeholder="Ask CodeOllie to write or edit code...">
            <button class="send-btn">Send</button>
        </div>
    </div>

<script src="renderer.js"></script></body>
</html>
